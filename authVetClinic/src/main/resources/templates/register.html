<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register - Vet Clinic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .register-container {
      max-width: 500px;
      width: 100%;
    }
    .register-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      padding: 2rem;
    }
    .register-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .register-header h2 {
      color: #2c3e50;
      font-weight: 600;
    }
    .form-control, .form-select {
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #e0e0e0;
    }
    .form-control:focus, .form-select:focus {
      border-color: #4a90e2;
      box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
    }
    .btn-primary {
      background-color: #4a90e2;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background-color: #357abd;
      transform: translateY(-2px);
    }
    .alert {
      border-radius: 8px;
    }
    .login-link {
      color: #4a90e2;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .login-link:hover {
      color: #357abd;
    }
    .form-label {
      font-weight: 500;
      color: #2c3e50;
    }
  </style>
  <script>
    function toggleSpecialization() {
      const roleSelect = document.getElementById('role');
      const specializationDiv = document.getElementById('specializationDiv');

      if (roleSelect.value === 'VETERINARIAN') {
        specializationDiv.style.display = 'block';
      } else {
        specializationDiv.style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      toggleSpecialization();
      document.getElementById('role').addEventListener('change', toggleSpecialization);
    });
  </script>
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <h2>Create Account</h2>
        <p class="text-muted">Join our veterinary community</p>
      </div>

      <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}" class="needs-validation">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" th:field="*{password}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">First Name</label>
          <input type="text" th:field="*{firstName}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" th:field="*{lastName}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Role</label>
          <select th:field="*{role}" id="role" class="form-select" required>
            <option value="">Select role</option>
            <option value="OWNER">Owner</option>
            <option value="VETERINARIAN">Veterinarian</option>
          </select>
        </div>

        <div class="mb-3" id="specializationDiv" style="display: none;">
          <label class="form-label">Specialization (Veterinarian only)</label>
          <input type="text" th:field="*{specialization}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary w-100">Register</button>

        <div class="text-center mt-3">
          <a th:href="@{/auth/login}" class="login-link">Already have an account? Log in</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
