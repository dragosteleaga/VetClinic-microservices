<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Animal Details - Vet Clinic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .details-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .details-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        .details-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .details-header h2 {
            color: #2c3e50;
            font-weight: 600;
        }
        .details-body {
            padding: 1.5rem;
        }
        dt {
            font-weight: 600;
            color: #2c3e50;
        }
        dd {
            margin-bottom: 1rem;
        }
        .back-button {
            background-color: #4a90e2;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }
        .back-button:hover {
            background-color: #357abd;
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>
    <div class="details-container">
        <div class="details-card">
            <div class="details-header">
                <h2>Animal Details</h2>
            </div>
            <div class="details-body">
                <dl class="row">
                    <dt class="col-sm-3">Name:</dt>
                    <dd class="col-sm-9" th:text="${animal.name}"></dd>

                    <dt class="col-sm-3">Species:</dt>
                    <dd class="col-sm-9" th:text="${animal.species}"></dd>

                    <dt class="col-sm-3">Breed:</dt>
                    <dd class="col-sm-9" th:text="${animal.breed}"></dd>

                    <dt class="col-sm-3">Birth Date:</dt>
                    <dd class="col-sm-9" th:text="${animal.birthDate}"></dd>

                    <dt class="col-sm-3">Medical History:</dt>
                    <dd class="col-sm-9" th:text="${animal.medicalHistory}"></dd>
                </dl>
            </div>
            <div class="text-center">
                <a th:href="@{/owner/dashboard}" class="back-button">Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
