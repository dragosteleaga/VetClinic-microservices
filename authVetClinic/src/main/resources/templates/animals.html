<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Animals</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">Your Animals</h2>

    <table class="table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Species</th>
            <th>Breed</th>
            <th>Birth Date</th>
            <th>Medical History</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="animal : ${animals}">
            <td th:text="${animal.name}">Name</td>
            <td th:text="${animal.species}">Species</td>
            <td th:text="${animal.breed}">Breed</td>
            <td th:text="${animal.birthDate}">Birth Date</td>
            <td th:text="${animal.medicalHistory}">Medical History</td>
        </tr>
        </tbody>
    </table>

    <div class="text-center">
        <a th:href="@{/owner/add-animal}" class="btn btn-primary">Add New Animal</a>
    </div>
</div>
</body>
</html>
