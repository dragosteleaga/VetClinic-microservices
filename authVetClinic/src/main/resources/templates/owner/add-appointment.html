<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Appointment - Vet Clinic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .appointment-container {
            max-width: 600px;
            width: 100%;
        }
        .appointment-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        .appointment-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .appointment-header h2 {
            color: #2c3e50;
            font-weight: 600;
        }
        .form-control, .form-select, textarea {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            width: 100%;
        }
        .form-control:focus, .form-select:focus, textarea:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }
        .btn-primary {
            background-color: #4a90e2;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }
        .form-label {
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            display: block;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="appointment-container">
        <div class="appointment-card">
            <div class="appointment-header">
                <h2>Book an Appointment</h2>
                <p class="text-muted">Schedule your pet's visit</p>
            </div>

            <form id="appointmentForm">
                <input type="hidden" id="ownerId" th:value="${owner.id}" />

                <div class="form-group">
                    <label class="form-label">Veterinarian ID</label>
                    <input type="number" id="veterinarianId" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Animal ID</label>
                    <input type="number" id="animalId" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Date & Time</label>
                    <input type="datetime-local" id="date" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Details</label>
                    <textarea id="details" class="form-control"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Price</label>
                    <input type="number" step="0.01" id="price" class="form-control" />
                </div>

                <div class="form-group">
                    <label class="form-label">Recipe ID (optional)</label>
                    <input type="number" id="recipeId" class="form-control" />
                </div>

                <button type="submit" class="btn btn-primary">Create Appointment</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("appointmentForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const appointment = {
                ownerId: document.getElementById("ownerId").value,
                veterinarianId: document.getElementById("veterinarianId").value,
                animalId: document.getElementById("animalId").value,
                date: document.getElementById("date").value,
                details: document.getElementById("details").value,
                price: document.getElementById("price").value,
                recipeId: document.getElementById("recipeId").value || null
            };

            try {
                const response = await fetch("/api/appointments", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(appointment)
                });

                if (response.ok) {
                    alert("Appointment created successfully!");
                    window.location.href = "/owner/dashboard";
                } else {
                    alert("Error creating appointment.");
                }
            } catch (error) {
                console.error("Fetch error:", error);
                alert("Something went wrong.");
            }
        });
    </script>
</body>
</html>
