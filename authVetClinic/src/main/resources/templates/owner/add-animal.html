<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Animal - Vet Clinic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .animal-container {
            max-width: 600px;
            width: 100%;
        }
        .animal-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        .animal-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .animal-header h2 {
            color: #2c3e50;
            font-weight: 600;
        }
        .form-control, .form-select, textarea {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            width: 100%;
        }
        .form-control:focus, .form-select:focus, textarea:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }
        .btn-primary {
            background-color: #4a90e2;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }
        .form-label {
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            display: block;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="animal-container">
        <div class="animal-card">
            <div class="animal-header">
                <h2>Add a New Pet</h2>
                <p class="text-muted">Enter your pet's details below</p>
            </div>

            <form id="addAnimalForm">
                <input type="hidden" id="ownerId" th:value="${owner.id}" />

                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="name" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Species</label>
                    <input type="text" id="species" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Breed</label>
                    <input type="text" id="breed" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Birth Date</label>
                    <input type="date" id="birthDate" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Medical History</label>
                    <textarea id="medicalHistory" class="form-control"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Save Animal</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("addAnimalForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const animal = {
                ownerId: document.getElementById("ownerId").value,
                name: document.getElementById("name").value,
                species: document.getElementById("species").value,
                breed: document.getElementById("breed").value,
                birthDate: document.getElementById("birthDate").value,
                medicalHistory: document.getElementById("medicalHistory").value
            };

            const response = await fetch("/api/owners/add-animal", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(animal)
            });

            if (response.ok) {
                window.location.href = "/owner/dashboard";
            } else {
                alert("Error adding animal.");
            }
        });
    </script>
</body>
</html>
