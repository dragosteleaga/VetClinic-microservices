<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Veterinarian Dashboard - Vet Clinic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .dashboard-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .dashboard-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .dashboard-header h2 {
            color: #2c3e50;
            font-weight: 600;
        }
        .table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .table thead th {
            background-color: #4a90e2;
            color: white;
            border: none;
            font-weight: 600;
        }
        .table tbody tr:hover {
            background-color: rgba(74, 144, 226, 0.05);
        }
        .btn-primary {
            background-color: #4a90e2;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }
        .pagination {
            margin-top: 2rem;
        }
        .page-link {
            color: #4a90e2;
            border: none;
            padding: 8px 16px;
            margin: 0 4px;
            border-radius: 8px;
        }
        .page-item.active .page-link {
            background-color: #4a90e2;
            border-color: #4a90e2;
        }
        .sort-icon {
            margin-left: 5px;
            cursor: pointer;
        }
        .sort-icon:hover {
            color: #357abd;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-card">
            <div class="dashboard-header">
                <h2>Veterinarian Dashboard</h2>
                <p class="text-muted">Welcome, <span th:text="${vet.firstName}">Veterinarian</span>! Here are your upcoming appointments.</p>
            </div>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col" class="sortable" data-sort="id">
                                Appointment ID
                                <span class="sort-icon">▼</span>
                            </th>
                            <th scope="col" class="sortable" data-sort="owner">
                                Owner Name
                                <span class="sort-icon">▼</span>
                            </th>
                            <th scope="col" class="sortable" data-sort="date">
                                Date & Time
                                <span class="sort-icon">▼</span>
                            </th>
                            <th scope="col" class="sortable" data-sort="details">
                                Details
                                <span class="sort-icon">▼</span>
                            </th>
                            <th scope="col" class="sortable" data-sort="price">
                                Price
                                <span class="sort-icon">▼</span>
                            </th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="appointment : ${appointments}">
                            <td th:text="${appointment.id}"></td>
                            <td th:text="${appointment.owner.firstName}"></td>
                            <td th:text="${appointment.date}"></td>
                            <td th:text="${appointment.details}"></td>
                            <td th:text="${appointment.price}"></td>
                            <td>
                                <button class="btn btn-primary btn-sm"
                                        th:onclick="'window.location.href=\'/vet/add-receipt/' + ${appointment.id} + '\';'">
                                    Add Receipt
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav aria-label="Page navigation" class="d-flex justify-content-center">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/vet/dashboard(page=${currentPage - 1}, sort=${sortField}, direction=${sortDirection})}" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>
                    <li class="page-item" th:each="page : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${page == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/vet/dashboard(page=${page}, sort=${sortField}, direction=${sortDirection})}"
                           th:text="${page}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/vet/dashboard(page=${currentPage + 1}, sort=${sortField}, direction=${sortDirection})}" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <script>
        document.querySelectorAll('.sortable').forEach(header => {
            header.addEventListener('click', function() {
                const sortField = this.dataset.sort;
                const currentUrl = new URL(window.location.href);
                const currentSort = currentUrl.searchParams.get('sort');
                const currentDirection = currentUrl.searchParams.get('direction');

                let newDirection = 'asc';
                if (currentSort === sortField && currentDirection === 'asc') {
                    newDirection = 'desc';
                }

                currentUrl.searchParams.set('sort', sortField);
                currentUrl.searchParams.set('direction', newDirection);
                window.location.href = currentUrl.toString();
            });
        });
    </script>
</body>
</html>
